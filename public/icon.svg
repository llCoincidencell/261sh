<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="goldBorderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="navyBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2557" />
      <stop offset="50%" stop-color="#142c65" />
      <stop offset="100%" stop-color="#091534" />
    </linearGradient>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="wingBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="trainRedGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="80%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Path for Arched TCDD Text -->
    <path id="tcddArcPath" d="M 230,225 A 250,250 0 0,1 570,225" fill="none" />
  </defs>

  <!-- ==================== WINGS (Behind Circle) ==================== -->
  <g filter="url(#dropShadow)">
    <!-- Left Wing Feathers -->
    <g>
      <!-- Base Wing Background Layer -->
      <path d="M 200,340 C 130,300 70,230 46,155 C 80,185 125,230 180,270 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />
      <!-- Feather 1 Top -->
      <path d="M 46,155 C 75,210 110,260 210,310 C 160,265 110,210 70,170 Z" fill="url(#wingBlueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
      <!-- Feather 2 -->
      <path d="M 58,220 C 95,260 140,300 230,340 C 175,295 125,250 85,215 Z" fill="url(#wingBlueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
      <!-- Feather 3 -->
      <path d="M 75,275 C 115,310 165,345 240,375 C 190,335 140,295 105,265 Z" fill="url(#wingBlueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
      <!-- Feather 4 Bottom -->
      <path d="M 98,330 C 140,360 185,385 245,405 C 205,375 160,345 125,320 Z" fill="url(#wingBlueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    </g>

    <!-- Right Wing Feathers -->
    <g>
      <!-- Base Wing Background Layer -->
      <path d="M 600,340 C 670,300 730,230 754,155 C 720,185 675,230 620,270 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />
      <!-- Feather 1 Top -->
      <path d="M 754,155 C 725,210 690,260 590,310 C 640,265 690,210 730,170 Z" fill="url(#wingBlueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
      <!-- Feather 2 -->
      <path d="M 742,220 C 705,260 660,300 570,340 C 625,295 675,250 715,215 Z" fill="url(#wingBlueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
      <!-- Feather 3 -->
      <path d="M 725,275 C 685,310 635,345 560,375 C 610,335 660,295 695,265 Z" fill="url(#wingBlueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
      <!-- Feather 4 Bottom -->
      <path d="M 702,330 C 660,360 615,385 555,405 C 595,375 640,345 675,320 Z" fill="url(#wingBlueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    </g>
  </g>

  <!-- ==================== MAIN EMBROIDERED CIRCLE ==================== -->
  <g filter="url(#dropShadow)">
    <!-- Outer Braided Gold Ring -->
    <circle cx="400" cy="380" r="325" fill="#0c1630" stroke="url(#goldBorderGrad)" stroke-width="14" />
    
    <!-- Inner Navy Circle -->
    <circle cx="400" cy="380" r="313" fill="url(#navyBgGrad)" stroke="#1e3a8a" stroke-width="4" />

    <!-- Secondary Golden Concentric Thread -->
    <circle cx="400" cy="380" r="280" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 4" />

    <!-- Center Sky Arch Area -->
    <circle cx="400" cy="380" r="274" fill="url(#skyGrad)" />
  </g>

  <!-- ==================== SPEED STRIPES (Upper Arc) ==================== -->
  <!-- Left Speed Lines -->
  <path d="M 180,290 C 230,240 280,210 320,195" fill="none" stroke="#dc2626" stroke-width="12" stroke-linecap="round" />
  <path d="M 160,320 C 220,265 270,235 305,220" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" />

  <!-- Right Speed Lines -->
  <path d="M 620,290 C 570,240 520,210 480,195" fill="none" stroke="#dc2626" stroke-width="12" stroke-linecap="round" />
  <path d="M 640,320 C 580,265 530,235 495,220" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" />

  <!-- ==================== TURKISH CRESCENT & STAR ==================== -->
  <g transform="translate(400, 240) scale(1.15)">
    <!-- Crescent Moon -->
    <path d="M 0,-40 A 35,35 0 1,0 0,30 A 28,28 0 1,1 0,-40 Z" fill="#dc2626" filter="url(#dropShadow)" />
    <!-- 5-Pointed Star -->
    <polygon points="26,-15 32,-3 45,-3 34,5 38,18 26,10 14,18 18,5 7,-3 20,-3" fill="#dc2626" />
  </g>

  <!-- ==================== ARCHED "TCDD" HEADER ==================== -->
  <!-- Navy Banner backing for TCDD -->
  <path d="M 220,200 C 270,140 530,140 580,200 C 540,165 260,165 220,200 Z" fill="#0b1736" stroke="url(#goldGrad)" stroke-width="3" />
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Impact, sans-serif" font-weight="900" font-size="78" fill="#ffffff" letter-spacing="14" filter="url(#dropShadow)">
    <textPath href="#tcddArcPath" startOffset="50%" text-anchor="middle">
      TCDD
    </textPath>
  </text>

  <!-- ==================== RAILWAY TRACKS (Perspective) ==================== -->
  <g>
    <!-- Left Rail -->
    <path d="M 120,530 C 240,490 320,440 375,395" fill="none" stroke="#64748b" stroke-width="12" />
    <path d="M 120,530 C 240,490 320,440 375,395" fill="none" stroke="#e2e8f0" stroke-width="4" />
    <!-- Right Rail -->
    <path d="M 460,590 C 470,520 455,445 425,395" fill="none" stroke="#64748b" stroke-width="12" />
    <path d="M 460,590 C 470,520 455,445 425,395" fill="none" stroke="#e2e8f0" stroke-width="4" />

    <!-- Sleepers / Ties -->
    <path d="M 170,525 L 235,510" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    <path d="M 225,505 L 285,492" stroke="#334155" stroke-width="7" stroke-linecap="round" />
    <path d="M 280,482 L 335,472" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <path d="M 330,460 L 375,452" stroke="#334155" stroke-width="5" stroke-linecap="round" />
    <path d="M 370,440 L 405,434" stroke="#334155" stroke-width="4" stroke-linecap="round" />

    <!-- Ballast Bed Glow -->
    <path d="M 110,540 C 260,490 360,430 440,395 L 430,390 C 350,420 230,480 100,535 Z" fill="#94a3b8" fill-opacity="0.3" />
  </g>

  <!-- ==================== TCDD ELECTRIC LOCOMOTIVE ==================== -->
  <g filter="url(#dropShadow)" id="train">
    <!-- Pantograph on Roof -->
    <g stroke="#334155" stroke-width="4" fill="none" stroke-linejoin="round">
      <path d="M 280,335 L 305,295 L 345,295 L 320,335" />
      <path d="M 305,295 L 315,280 L 360,280" />
      <line x1="300" y1="280" x2="375" y2="280" stroke="#ef4444" stroke-width="5" />
    </g>

    <!-- Locomotive Body: Side (White with Blue/Red stripes) -->
    <path d="M 150,470 L 390,440 L 405,335 L 260,345 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <!-- Blue/Red livery lines on side -->
    <path d="M 155,450 L 390,420" stroke="#1e40af" stroke-width="8" />
    <path d="M 158,458 L 390,428" stroke="#dc2626" stroke-width="4" />
    <!-- TCDD Winged Logo on Train Side -->
    <circle cx="280" cy="400" r="14" fill="#dc2626" />
    <path d="M 260,400 C 270,390 290,390 300,400 C 290,404 270,404 260,400 Z" fill="#38bdf8" />

    <!-- Locomotive Front Cab (Red Aerodynamic Nose) -->
    <path d="M 390,440 L 585,420 C 600,420 615,445 610,480 C 605,510 570,545 440,555 L 405,515 Z" fill="url(#trainRedGrad)" stroke="#0f172a" stroke-width="4" />

    <!-- Windshield -->
    <path d="M 405,342 L 530,348 C 570,352 590,380 585,420 L 400,435 Z" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="3" />
    <!-- Windshield Center Divider & Wiper -->
    <line x1="495" y1="346" x2="495" y2="425" stroke="#475569" stroke-width="4" />
    <line x1="440" y1="410" x2="475" y2="380" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="535" y1="410" x2="565" y2="380" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Front Nose Wing Emblem on Red Hood -->
    <g transform="translate(540, 450) scale(0.65)">
      <path d="M -30,0 C -15,-12 15,-12 30,0 C 15,6 -15,6 -30,0 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="6" fill="#dc2626" />
    </g>

    <!-- Lower Cowcatcher & Bogie / Wheel Buffer Beam -->
    <path d="M 410,510 L 440,555 L 595,540 L 610,505 L 590,500 L 480,512 Z" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
    <!-- Buffer Coupler -->
    <rect x="525" y="520" width="30" height="24" rx="4" fill="#475569" stroke="#020617" stroke-width="2" />

    <!-- Headlights Glowing -->
    <circle cx="475" cy="485" r="14" fill="url(#lightGlow)" filter="url(#subtleGlow)" />
    <circle cx="475" cy="485" r="8" fill="#ffffff" />

    <circle cx="585" cy="475" r="14" fill="url(#lightGlow)" filter="url(#subtleGlow)" />
    <circle cx="585" cy="475" r="8" fill="#ffffff" />
  </g>

  <!-- ==================== BOTTOM RIBBON BANNER ==================== -->
  <g filter="url(#dropShadow)" transform="translate(0, 10)">
    <!-- Ribbon Tails (Left & Right Fold Ends) -->
    <!-- Left Ribbon Tail -->
    <path d="M 120,630 L 190,590 L 190,665 L 140,695 L 165,655 L 120,630 Z" fill="#091329" stroke="url(#goldGrad)" stroke-width="4" />
    <!-- Right Ribbon Tail -->
    <path d="M 680,630 L 610,590 L 610,665 L 660,695 L 635,655 L 680,630 Z" fill="#091329" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- Main Curved Banner Body -->
    <path d="M 180,575 C 320,535 480,535 620,575 C 640,610 635,660 615,685 C 475,640 325,640 185,685 C 165,660 160,610 180,575 Z" 
          fill="url(#navyBgGrad)" stroke="url(#goldBorderGrad)" stroke-width="8" />

    <!-- Inner Golden Border Line -->
    <path d="M 195,585 C 330,548 470,548 605,585 C 618,615 615,648 600,670 C 470,632 330,632 200,670 C 185,648 182,615 195,585 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Lower Scroll / Sub-Banner: "Haberleşme Şefliği" -->
    <path d="M 215,660 C 335,630 465,630 585,660 C 595,685 590,720 575,735 C 460,705 340,705 225,735 C 210,720 205,685 215,660 Z" 
          fill="#0c1836" stroke="url(#goldBorderGrad)" stroke-width="6" />

    <!-- Text Line 1: "261 Sinyalizasyon ve" -->
    <text x="400" y="618" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="34" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="2"
          filter="url(#dropShadow)">
      261 Sinyalizasyon ve
    </text>

    <!-- Text Line 2: "Haberleşme Şefliği" -->
    <text x="400" y="708" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="38" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="3"
          filter="url(#dropShadow)">
      Haberleşme Şefliği
    </text>
  </g>
</svg>
