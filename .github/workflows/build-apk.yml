name: Web Sitesini Yayınla (GitHub Pages)

on:
  push:
    branches: ["main"] # veya master kullanıyorsan master yap

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Yükle
        run: npm install --legacy-peer-deps

      - name: Web İçin Derle
        run: npm run build

      - name: GitHub Pages Ayarları
        uses: actions/configure-pages@v5

      - name: Dosyaları Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Yayına Al
        id: deployment
        uses: actions/deploy-pages@v4
        
