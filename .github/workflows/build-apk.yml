name: TCDD 261 Android APK Derleme

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Android APK Oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Web Uygulamasını Derle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Capacitor Kur ve Android Ortamını Hazırla
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          
          # capacitor.config.json yoksa otomatik oluştur
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"tr.gov.tcdd.saha261","appName":"TCDD 261 Saha Asistani","webDir":"dist"}' > capacitor.config.json
          fi

          # android klasörü depoda yoksa otomatik üret
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi

          npx @capacitor/cli sync android

      - name: Gradle İzinlerini Ver ve APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK Dosyasını İndirilebilir Yap (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: TCDD-261-Saha-Asistani-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
