name: TCDD 261 Android APK Derleme

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Android APK Oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK Lisanslarını Onayla
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Web Uygulamasını Derle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Capacitor Kur ve Android Ortamını Hazırla
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"tr.gov.tcdd.saha261","appName":"TCDD 261 Saha Asistani","webDir":"dist"}' > capacitor.config.json
          fi

          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi

          npx @capacitor/cli sync android

          # Kotlin stdlib çakışmasını (checkDebugDuplicateClasses) kökten çöz
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          cat << 'EOF' >> android/app/build.gradle

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}
EOF

      - name: Gradle İle APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m"

      - name: APK Dosyasını İndirilebilir Yap (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: TCDD-261-Saha-Asistani-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
